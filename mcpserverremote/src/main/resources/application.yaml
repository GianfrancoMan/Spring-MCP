server:
  port: 8090

logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"

spring:
  application:
    name: mcpserverremote
  datasource:
    url: jdbc:h2:file:<your path for file-db>;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: user
    password: 12345
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    mcp:
      server:
        protocol: streamable
        streamable-http:
          mcp-endpoint: /api/mcp

